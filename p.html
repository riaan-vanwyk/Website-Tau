    <script>
      // This must run AS SOON as possible, even before window.onload
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual'
      }

      window.onload = function () {
        // 1. Website loaded -> wait 10ms
        setTimeout(function () {
          // 2. Goto top
          window.scrollTo(0, 0)
          console.log('Scrolled to top')

          // 3. Wait another 10ms -> start removing loader
          setTimeout(function () {
            const loader = document.getElementById('preloader')

            // Start fade
            loader.style.transition = 'opacity 0.5s ease'
            loader.style.opacity = '0'
            loader.style.visibility = 'hidden'

            // 4. Final Cleanup (Physical removal)
            // We wait for the 0.5s fade to finish so it looks smooth
            setTimeout(function () {
              loader.style.display = 'none'
              loader.style.zIndex = '-1'
              // Ensure hash is set without jumping the page again
              if (window.location.hash !== '#top') {
                history.replaceState(null, null, '#top')
              }
            }, 500)

            console.log('Loader removing...')
          }, 10000000)
        }, 100)
      }

      // The "Hard Reload" fix for the browser Back button
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
          window.location.reload()
        }
      })
    </script>

<script>
(function () {
    const BASE_ORIGIN = 'https://riaanvwyk.vercel.app';

    // Everything after the "?", plus a #fragment if there is one
    let raw = location.search.slice(1) + location.hash;

    try {
        raw = decodeURIComponent(raw);
    } catch (e) {}

    const frame = document.getElementById('Iframe');
    const msg = document.getElementById('msg');

    if (!raw) {
        if (msg) {
            msg.textContent = 'Usage: p?GraviSim_Presentation.html';
            msg.hidden = false;
        }
        return;
    }

    // Block dangerous protocols (e.g., javascript:, data:)
    if (/^[a-zA-Z][a-zA-Z\d+\-.]*:/.test(raw) && !/^https?:\/\//i.test(raw)) {
        if (msg) {
            msg.textContent = 'Invalid URL scheme.';
            msg.hidden = false;
        }
        return;
    }

    // If a full http(s) URL was passed, use it directly; otherwise prepend BASE_ORIGIN
    let targetUrl;
    if (/^https?:\/\//i.test(raw)) {
        targetUrl = raw;
    } else {
        const cleanPath = raw.startsWith('/') ? raw : '/' + raw;
        targetUrl = BASE_ORIGIN + cleanPath;
    }

    frame.src = targetUrl;
    frame.hidden = false;
})();
</script>

<script>
    const scrollbar = document.getElementById('scrollbarThumb');
    let isDragging = false;
    let startY;
    let startScrollTop;

    // 1. Update the thumb position whenever the page scrolls (whether by mousewheel or dragging)
    window.addEventListener('scroll', () => {
        const scrollTop = document.documentElement.scrollTop || window.scrollY;
        const scrollHeight = document.documentElement.scrollHeight;
        const clientHeight = document.documentElement.clientHeight;
        const scrollableHeight = scrollHeight - clientHeight;

        if (scrollableHeight > 0) {
            const scrollPercent = (scrollTop / scrollableHeight) * 97;
            scrollbar.style.marginTop = scrollPercent + "vh";
        }
    });

    // 2. Start dragging when the user clicks the scrollbar thumb
    scrollbar.addEventListener('mousedown', (e) => {
        isDragging = true;
        startY = e.clientY; 
        startScrollTop = document.documentElement.scrollTop || window.scrollY; 
        
        // Prevent text highlighting while dragging
        document.body.style.userSelect = 'none'; 
        
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
    });

    // 3. Move the page as the user drags their mouse
    function onMouseMove(e) {
        if (!isDragging) return;
        
        // How far the mouse moved in pixels
        const deltaY = e.clientY - startY;
        
        const scrollHeight = document.documentElement.scrollHeight;
        const clientHeight = document.documentElement.clientHeight;
        const scrollablePageHeight = scrollHeight - clientHeight;
        
        // Calculate the height of 97vh in actual pixels
        const trackHeightInPixels = (97 / 100) * window.innerHeight;
        
        // Figure out the ratio between the page height and your custom track height
        const scrollRatio = scrollablePageHeight / trackHeightInPixels;
        
        // Move the actual page. This will automatically trigger the 'scroll' event listener above, 
        // which will move the thumb perfectly in sync.
        window.scrollTo(0, startScrollTop + (deltaY * scrollRatio));
    }

    // 4. Stop dragging when the mouse is released
    function onMouseUp() {
        isDragging = false;
        document.body.style.userSelect = ''; // Re-enable text highlighting
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
    }
</script>
